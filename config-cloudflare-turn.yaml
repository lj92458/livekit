# LiveKit Server Configuration with Cloudflare TURN
# 
# This configuration file demonstrates how to use Cloudflare TURN with LiveKit
#
# Environment Variables Required:
#   - CF_TURN_KEY_ID: Your Cloudflare TURN Key ID
#   - CF_TURN_API_TOKEN: Your Cloudflare API Token
#   - CF_TURN_TTL: Optional, default is 86400 (24 hours)

# Main TCP port for RoomService and RTC endpoint
port: 7880

# Redis configuration (required for distributed setup)
redis:
  address: localhost:6379
  # password: ""
  # db: 0

# WebRTC configuration
rtc:
  # UDP ports to use for client traffic
  port_range_start: 50000
  port_range_end: 60000
  
  # TCP port for WebRTC ICE over TCP
  tcp_port: 7881
  
  # Use external IP discovery
  use_external_ip: true
  
  # STUN servers (optional, defaults to Google's public STUN)
  stun_servers:
    - stun:stun.cloudflare.com:3478
  
  # Note: When CF_TURN_KEY_ID is set, static turn_servers are ignored
  # Cloudflare TURN servers will be used automatically
  # turn_servers:
  #   - host: myhost.com
  #     port: 443
  #     protocol: tls
  #     username: ""
  #     credential: ""

# Embedded TURN server (optional, used as fallback if Cloudflare TURN fails)
turn:
  enabled: false
  # udp_port: 3478
  # tls_port: 5349
  # domain: turn.myhost.com
  # cert_file: /path/to/cert.pem
  # key_file: /path/to/key.pem

# API keys for JWT authentication
keys:
  devkey: secret

# Logging configuration
logging:
  level: info
  pion_level: error

# Node configuration
region: us-west-2
node_ip: 127.0.0.1

# Room defaults
room:
  empty_timeout: 300
  max_participants: 0
  enabled_codecs:
    - mime: audio/opus
    - mime: video/vp8
    - mime: video/h264

# Prometheus metrics
# prometheus_port: 6789
# environment: production
